name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  check-flake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31
      - name: Evaluate supported outputs
        run: |
          nix flake check --all-systems --no-build --print-build-logs

  build-home-configuration:
    needs: check-flake
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: wslfish
          - check: revel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: pecigonzalo
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build activation package
        run: |
          nix build --print-build-logs .#checks.x86_64-linux.${{ matrix.check }}

  build-darwin-configuration:
    needs: check-flake
    strategy:
      fail-fast: false
      matrix:
        include:
          - check: githubCI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: cachix/install-nix-action@91f6a0f59e94dfb2cfed0f4000f36a68ead1d20c # v31

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: pecigonzalo
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build system
        run: |
          nix build --print-build-logs .#checks.aarch64-darwin.${{ matrix.check }}
